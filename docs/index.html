<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F7FB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Offline-first personal study planner, editable syllabus tracker, study timer, daily tasks, MCQ & mock test tracker for TG ECET 2027." />
  <title>ECET Tracker 2027</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="nav-rail" class="nav-rail" aria-label="Primary navigation">
      <div class="rail-brand">
        <img src="./icon-192.png" alt="ECET Tracker 2027" class="rail-logo" />
        <span class="rail-title">ECET 2027</span>
      </div>
      <div class="rail-items" id="rail-nav-items"></div>
    </aside>

    <div class="main-column">
      <div id="install-banner" class="install-banner hidden" role="region" aria-label="Install app">
        <div class="install-banner-text">
          <strong>Install ECET Tracker 2027</strong>
          <span>Add to your Android home screen for offline access</span>
        </div>
        <div class="install-banner-actions">
          <button id="btn-install-pwa" class="btn btn-primary btn-sm" type="button">Install</button>
          <button id="btn-dismiss-install" class="btn btn-ghost btn-sm" type="button" aria-label="Dismiss">✕</button>
        </div>
      </div>

      <main id="main-content" class="main-content" tabindex="-1"></main>

      <nav id="bottom-nav" class="bottom-nav" aria-label="Bottom navigation"></nav>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div id="modal-card" class="modal-card"></div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
